name: JavaScript SDK

on:
  pull_request:
    paths:
      - ".github/workflows/js-sdk.yml"
      - "applications/system/js_app/packages/create-fz-app/**"
      - "applications/system/js_app/packages/fz-sdk/**"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/js-sdk.yml"
      - "applications/system/js_app/packages/create-fz-app/**"
      - "applications/system/js_app/packages/fz-sdk/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: JS SDK packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"

      - name: Verify SDK package
        working-directory: applications/system/js_app/packages/fz-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level moderate
          pnpm test
          pnpm docs

      - name: Verify project wizard
        working-directory: applications/system/js_app/packages/create-fz-app
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level moderate
          pnpm test

name: JavaScript SDK

on:
  pull_request:
    paths:
      - ".github/workflows/js-sdk.yml"
      - ".github/scripts/test-js-runtime.mjs"
      - "applications/system/js_app/packages/create-fz-app/**"
      - "applications/system/js_app/packages/fz-sdk/**"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/js-sdk.yml"
      - ".github/scripts/test-js-runtime.mjs"
      - "applications/system/js_app/packages/create-fz-app/**"
      - "applications/system/js_app/packages/fz-sdk/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: JS SDK packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install --global pnpm@10.34.5

      - name: Verify SDK package
        working-directory: applications/system/js_app/packages/fz-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level moderate
          pnpm test
          pnpm run docs

      - name: Verify project wizard
        working-directory: applications/system/js_app/packages/create-fz-app
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level moderate
          pnpm test

  runtime:
    name: Packed runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["18.12.0", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        run: npm install --global pnpm@10.34.5

      - name: Check packed SDK and wizard in fresh production consumers
        run: node .github/scripts/test-js-runtime.mjs

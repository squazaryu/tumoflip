name: Package Release

on:
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: "Existing firmware release tag, for example v1.0.4 or t-dev-004-013"
        required: true
        type: string
      package_ref:
        description: "Branch, tag, or commit containing package-only changes"
        required: true
        default: "main"
        type: string
      catalog_release_tag:
        description: "Optional immutable catalog tag, for example fw-packages-dev-001"
        required: false
        type: string
      compatible_catalog_tag:
        description: "Optional prior catalog whose exact overlays remain accepted"
        required: false
        type: string
      base_catalog_tag:
        description: "Optional exact immutable catalog used as a selective delta base"
        required: false
        type: string
      selective_overlays:
        description: "Audited comma-separated overlays (currently: esp_flasher)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.catalog_release_tag || github.event.inputs.target_release_tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FBT_NO_SYNC: 0
  FORCE_NO_DIRTY: "yes"
  FBT_GIT_SUBMODULE_SHALLOW: 1

jobs:
  package-release:
    name: build and publish SD packages
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout package ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.package_ref }}
          submodules: recursive
          fetch-depth: 0
          clean: "true"

      - name: Resolve target release
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.target_release_tag }}
          CATALOG_TAG: ${{ github.event.inputs.catalog_release_tag }}
          COMPATIBLE_TAG: ${{ github.event.inputs.compatible_catalog_tag }}
          BASE_TAG: ${{ github.event.inputs.base_catalog_tag }}
          SELECTIVE_OVERLAYS: ${{ github.event.inputs.selective_overlays }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.]+)?$ ]]; then
            CHANNEL="stable"
          elif [[ "$TAG" =~ ^t-dev-([0-9]{3}-){1,2}[0-9]{3}$ ]]; then
            CHANNEL="dev"
          else
            echo "Target release tag must look like v1.0.4 or t-dev-004-013; got: $TAG" >&2
            exit 1
          fi
          if [[ -n "$CATALOG_TAG" ]]; then
            if [[ "$CATALOG_TAG" =~ ^fw-packages-(stable|dev)-([0-9]{3})$ ]]; then
              CATALOG_CHANNEL="${BASH_REMATCH[1]}"
              CATALOG_REVISION="${BASH_REMATCH[2]}"
            else
              echo "Catalog tag must look like fw-packages-stable-001 or fw-packages-dev-001" >&2
              exit 1
            fi
            if [[ "$CATALOG_REVISION" == "000" ]]; then
              echo "Catalog revision must be greater than zero" >&2
              exit 1
            fi
            if [[ "$CATALOG_CHANNEL" != "$CHANNEL" ]]; then
              echo "Catalog channel $CATALOG_CHANNEL does not match target channel $CHANNEL" >&2
              exit 1
            fi
            EXPECTED_BASELINE="$(python3 - "$CATALOG_CHANNEL" <<'PY'
          import json
          import sys
          from pathlib import Path
          document = json.loads(
              Path("tools/tumoflip/package_catalog_baselines.json").read_text()
          )
          if document.get("schema") != 1:
              raise SystemExit("Package catalog baselines must use schema 1")
          print(document[sys.argv[1]]["release_tag"])
          PY
            )"
            if [[ "$TAG" != "$EXPECTED_BASELINE" ]]; then
              echo "Catalog $CATALOG_CHANNEL baseline must be $EXPECTED_BASELINE; got: $TAG" >&2
              exit 1
            fi
            if gh release view "$CATALOG_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Catalog release $CATALOG_TAG already exists; publish a new revision instead" >&2
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CATALOG_TAG" >/dev/null 2>&1; then
              echo "Catalog tag $CATALOG_TAG already exists; publish a new revision instead" >&2
              exit 1
            fi
            if [[ -n "$COMPATIBLE_TAG" ]]; then
              if [[ "$COMPATIBLE_TAG" =~ ^fw-packages-(stable|dev)-([0-9]{3})$ ]]; then
                COMPATIBLE_CHANNEL="${BASH_REMATCH[1]}"
                COMPATIBLE_REVISION="${BASH_REMATCH[2]}"
              else
                echo "Compatible catalog tag is invalid: $COMPATIBLE_TAG" >&2
                exit 1
              fi
              if [[ "$COMPATIBLE_CHANNEL" != "$CATALOG_CHANNEL" ]]; then
                echo "Compatible catalog channel differs from $CATALOG_CHANNEL" >&2
                exit 1
              fi
              if (( 10#$COMPATIBLE_REVISION >= 10#$CATALOG_REVISION )); then
                echo "Compatible catalog must precede $CATALOG_TAG" >&2
                exit 1
              fi
            fi
            if [[ -n "$BASE_TAG" ]]; then
              if [[ "$BASE_TAG" =~ ^fw-packages-(stable|dev)-([0-9]{3})$ ]]; then
                BASE_CHANNEL="${BASH_REMATCH[1]}"
                BASE_REVISION="${BASH_REMATCH[2]}"
              else
                echo "Base catalog tag is invalid: $BASE_TAG" >&2
                exit 1
              fi
              if [[ "$BASE_CHANNEL" != "$CATALOG_CHANNEL" ]]; then
                echo "Base catalog channel differs from $CATALOG_CHANNEL" >&2
                exit 1
              fi
              if (( 10#$BASE_REVISION >= 10#$CATALOG_REVISION )); then
                echo "Base catalog must precede $CATALOG_TAG" >&2
                exit 1
              fi
            fi
          elif [[ -n "$COMPATIBLE_TAG" || -n "$BASE_TAG" ]]; then
            echo "Prior catalog inputs require an independent catalog tag" >&2
            exit 1
          fi
          if [[ -n "$COMPATIBLE_TAG" && -n "$BASE_TAG" ]]; then
            echo "Compatible and selective base catalogs are mutually exclusive" >&2
            exit 1
          fi
          if [[ -n "$BASE_TAG" && -z "$SELECTIVE_OVERLAYS" ]] || \
             [[ -z "$BASE_TAG" && -n "$SELECTIVE_OVERLAYS" ]]; then
            echo "Base catalog and selective overlays must be supplied together" >&2
            exit 1
          fi
          NORMALIZED_SELECTIVE_OVERLAYS=""
          if [[ -n "$BASE_TAG" ]]; then
            NORMALIZED_SELECTIVE_OVERLAYS="$(
              python3 - "$SELECTIVE_OVERLAYS" <<'PY'
          import sys
          from tools.tumoflip.package_release import selective_catalog_overlay_names
          print(",".join(selective_catalog_overlay_names(sys.argv[1])))
          PY
            )"
            PINNED_BASE_TAG="$(
              python3 - "$CATALOG_CHANNEL" <<'PY'
          import sys
          from pathlib import Path
          from tools.tumoflip.package_release import catalog_lineage_base
          print(catalog_lineage_base(Path.cwd(), sys.argv[1])["release_tag"])
          PY
            )"
            if [[ "$BASE_TAG" != "$PINNED_BASE_TAG" ]]; then
              echo "Base catalog $BASE_TAG is not pinned latest $PINNED_BASE_TAG" >&2
              exit 1
            fi
            CATALOG_REVISION_NUMBER=$((10#$CATALOG_REVISION))
            LATEST_LIVE_BASE="$(
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
              jq -er \
                --arg channel "$CATALOG_CHANNEL" \
                --argjson new_revision "$CATALOG_REVISION_NUMBER" '
                  [
                    .[][]
                    | select(.draft == false)
                    | select(
                        (($channel == "dev") and (.prerelease == true)) or
                        (($channel == "stable") and (.prerelease == false))
                      )
                    | .tag_name as $tag
                    | try (
                        $tag
                        | capture("^fw-packages-(?<channel>stable|dev)-(?<revision>[0-9]{3})$")
                      ) catch null
                    | select(. != null and .channel == $channel)
                    | .revision = (.revision | tonumber)
                    | select(.revision < $new_revision)
                    | {tag: $tag, revision: .revision}
                  ]
                  | max_by(.revision)
                  | .tag
                '
            )"
            if [[ "$BASE_TAG" != "$LATEST_LIVE_BASE" ]]; then
              echo "Base catalog must be latest live predecessor $LATEST_LIVE_BASE" >&2
              exit 1
            fi
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          peel_tag() {
            local TYPE SHA
            read -r TYPE SHA < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" \
                --jq '.object.type + " " + .object.sha'
            )
            while [[ "$TYPE" == "tag" ]]; do
              read -r TYPE SHA < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" \
                  --jq '.object.type + " " + .object.sha'
              )
            done
            if [[ "$TYPE" != "commit" || ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release tag $1 does not resolve to a commit" >&2
              return 1
            fi
            printf '%s\n' "$SHA"
          }
          TARGET_COMMIT="$(peel_tag "$TAG")"
          TARGET_DIR="$RUNNER_TEMP/tumoflip-target-release"
          mkdir -p "$TARGET_DIR"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$TARGET_DIR" \
            --pattern "tumoflip-packages.json" \
            --pattern "tumoflip-packages.zip"
          if [[ "$CHANNEL" == "dev" ]]; then
            MANIFEST_VERSION="$(python3 - "$TARGET_DIR/tumoflip-packages.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text())["firmware"]["version"])
          PY
            )"
            if [[ "$MANIFEST_VERSION" != "$TAG" ]]; then
              echo "Dev release tag $TAG does not match manifest firmware $MANIFEST_VERSION" >&2
              exit 1
            fi
          fi
          if [[ -n "$COMPATIBLE_TAG" ]]; then
            gh release view "$COMPATIBLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            COMPATIBLE_DIR="$RUNNER_TEMP/tumoflip-compatible-catalog"
            mkdir -p "$COMPATIBLE_DIR"
            gh release download "$COMPATIBLE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$COMPATIBLE_DIR" \
              --pattern "tumoflip-packages.json" \
              --pattern "tumoflip-packages.zip" \
              --pattern "${COMPATIBLE_TAG}-SHA256SUMS"
            python3 tools/tumoflip/verify_release_assets.py \
              "$COMPATIBLE_DIR/${COMPATIBLE_TAG}-SHA256SUMS" \
              "$COMPATIBLE_DIR/tumoflip-packages.json" \
              "$COMPATIBLE_DIR/tumoflip-packages.zip"
            COMPATIBLE_COMMIT="$(peel_tag "$COMPATIBLE_TAG")"
            COMPATIBLE_SOURCE="$(python3 - "$COMPATIBLE_DIR/tumoflip-packages.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text())["package_release"]["source_commit"])
          PY
            )"
            if [[ "$COMPATIBLE_COMMIT" != "$TARGET_COMMIT" || "$COMPATIBLE_SOURCE" != "$TARGET_COMMIT" ]]; then
              echo "Compatible catalog was not published from target commit $TARGET_COMMIT" >&2
              exit 1
            fi
            echo "compatible_tag=$COMPATIBLE_TAG" >> "$GITHUB_OUTPUT"
            echo "compatible_manifest=$COMPATIBLE_DIR/tumoflip-packages.json" >> "$GITHUB_OUTPUT"
            echo "compatible_package_zip=$COMPATIBLE_DIR/tumoflip-packages.zip" >> "$GITHUB_OUTPUT"
          else
            echo "compatible_tag=" >> "$GITHUB_OUTPUT"
            echo "compatible_manifest=" >> "$GITHUB_OUTPUT"
            echo "compatible_package_zip=" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$BASE_TAG" ]]; then
            gh release view "$BASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            BASE_DIR="$RUNNER_TEMP/tumoflip-base-catalog"
            mkdir -p "$BASE_DIR"
            gh release download "$BASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$BASE_DIR" \
              --pattern "tumoflip-packages.json" \
              --pattern "tumoflip-packages.zip" \
              --pattern "${BASE_TAG}-SHA256SUMS"
            python3 tools/tumoflip/verify_release_assets.py \
              "$BASE_DIR/${BASE_TAG}-SHA256SUMS" \
              "$BASE_DIR/tumoflip-packages.json" \
              "$BASE_DIR/tumoflip-packages.zip"
            python3 - \
              "$CATALOG_CHANNEL" \
              "$BASE_DIR/tumoflip-packages.json" \
              "$BASE_DIR/tumoflip-packages.zip" <<'PY'
          import json
          import sys
          from pathlib import Path
          from tools.tumoflip.package_release import catalog_lineage_base, file_sha256
          channel, manifest_path, package_zip = sys.argv[1:]
          expected = catalog_lineage_base(Path.cwd(), channel)
          manifest_file = Path(manifest_path)
          manifest = json.loads(manifest_file.read_text())
          release = manifest.get("package_release", {})
          actual = {
              "manifest_sha256": file_sha256(manifest_file),
              "package_zip_sha256": file_sha256(Path(package_zip)),
              "release_id": manifest.get("release_id"),
              "source_commit": release.get("source_commit"),
              "target_release_id": release.get("target_release_id"),
              "target_release_tag": release.get("target_release_tag"),
              "firmware_version": manifest.get("firmware", {}).get("version"),
          }
          for key, value in actual.items():
              if value != expected[key]:
                  raise SystemExit(f"Pinned base catalog {key} differs")
          PY
            BASE_COMMIT="$(peel_tag "$BASE_TAG")"
            BASE_SOURCE="$(python3 - "$BASE_DIR/tumoflip-packages.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text())["package_release"]["source_commit"])
          PY
            )"
            if [[ "$BASE_COMMIT" != "$BASE_SOURCE" ]]; then
              echo "Base catalog tag commit differs from manifest provenance" >&2
              exit 1
            fi
            echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
            echo "base_source_commit=$BASE_SOURCE" >> "$GITHUB_OUTPUT"
            echo "base_manifest=$BASE_DIR/tumoflip-packages.json" >> "$GITHUB_OUTPUT"
            echo "base_package_zip=$BASE_DIR/tumoflip-packages.zip" >> "$GITHUB_OUTPUT"
            echo "selective_overlays=$NORMALIZED_SELECTIVE_OVERLAYS" >> "$GITHUB_OUTPUT"
          else
            echo "base_tag=" >> "$GITHUB_OUTPUT"
            echo "base_source_commit=" >> "$GITHUB_OUTPUT"
            echo "base_manifest=" >> "$GITHUB_OUTPUT"
            echo "base_package_zip=" >> "$GITHUB_OUTPUT"
            echo "selective_overlays=" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "manifest=$TARGET_DIR/tumoflip-packages.json" >> "$GITHUB_OUTPUT"
          echo "package_zip=$TARGET_DIR/tumoflip-packages.zip" >> "$GITHUB_OUTPUT"
          echo "catalog_tag=$CATALOG_TAG" >> "$GITHUB_OUTPUT"

      - name: Install Python package dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user Pillow heatshrink2==0.13.0

      - name: Check README release metadata
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
          CHANNEL: ${{ steps.target.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "stable" ]]; then
            python3 tools/tumoflip/sync_readme_version.py \
              --release-tag "$TAG" \
              --check
          else
            python3 tools/tumoflip/sync_readme_version.py --check
          fi

      - name: Build selective package resources
        if: steps.target.outputs.base_tag != ''
        shell: bash
        env:
          SELECTIVE_OVERLAYS: ${{ steps.target.outputs.selective_overlays }}
        run: |
          set -euo pipefail
          mapfile -t SELECTIVE_FBT_TARGETS < <(
            python3 - "$SELECTIVE_OVERLAYS" <<'PY'
          import sys
          from tools.tumoflip.package_release import selective_catalog_build_targets
          for target in selective_catalog_build_targets(sys.argv[1]):
              print(target)
          PY
          )
          if (( ${#SELECTIVE_FBT_TARGETS[@]} == 0 )); then
            echo "Selective catalog resolved no build targets" >&2
            exit 1
          fi
          ./fbt COMPACT=1 DEBUG=0 FBT_NO_SYNC="${FBT_NO_SYNC}" \
            "${SELECTIVE_FBT_TARGETS[@]}" -j2

      - name: Build full package resources
        if: steps.target.outputs.compatible_tag == '' && steps.target.outputs.base_tag == ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf applications/main/clock_app/resources/apps/ || true
          mapfile -t TOTP_PLUGIN_TARGETS < <(python3 - <<'PY'
          from tools.tumoflip.validate_release import TOTP_CLI_PLUGIN_APP_IDS
          for appid in TOTP_CLI_PLUGIN_APP_IDS:
              print(f"fap_{appid}")
          PY
          )
          ./fbt COMPACT=1 DEBUG=0 FBT_NO_SYNC="${FBT_NO_SYNC}" \
            updater_package fap_esp_flasher fap_subghz_raw_edit \
            "${TOTP_PLUGIN_TARGETS[@]}" -j2

      - name: Run package release tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools/tumoflip/test_package_release.py \
            tools/tumoflip/test_readme_version_sync.py \
            tools/tumoflip/test_validate_release.py \
            tools/tumoflip/test_esp_flash_package.py \
            tools/tumoflip/test_apply_packages.py \
            tools/tumoflip/test_make_packages_zip.py \
            tools/tumoflip/test_verify_release_assets.py \
            tools/tumoflip/test_wifi_mapper.py

      - name: Build package-only assets
        id: packages
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
          TARGET_MANIFEST: ${{ steps.target.outputs.manifest }}
          TARGET_PACKAGE_ZIP: ${{ steps.target.outputs.package_zip }}
          CATALOG_TAG: ${{ steps.target.outputs.catalog_tag }}
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          COMPATIBLE_MANIFEST: ${{ steps.target.outputs.compatible_manifest }}
          COMPATIBLE_PACKAGE_ZIP: ${{ steps.target.outputs.compatible_package_zip }}
          BASE_MANIFEST: ${{ steps.target.outputs.base_manifest }}
          BASE_PACKAGE_ZIP: ${{ steps.target.outputs.base_package_zip }}
          BASE_TAG: ${{ steps.target.outputs.base_tag }}
          BASE_SOURCE_COMMIT: ${{ steps.target.outputs.base_source_commit }}
          SELECTIVE_OVERLAYS: ${{ steps.target.outputs.selective_overlays }}
        run: |
          set -euo pipefail
          PACKAGE_ARGS=(
            --build-dir build/f7-firmware-C
            --target-release-tag "$TAG"
            --target-manifest "$TARGET_MANIFEST"
            --target-package-zip "$TARGET_PACKAGE_ZIP"
          )
          if [[ -n "$CATALOG_TAG" ]]; then
            PACKAGE_ARGS+=(--catalog-release-tag "$CATALOG_TAG")
          fi
          if [[ -n "$COMPATIBLE_MANIFEST" ]]; then
            PACKAGE_ARGS+=(
              --target-source-commit "$TARGET_COMMIT"
              --compatible-manifest "$COMPATIBLE_MANIFEST"
              --compatible-package-zip "$COMPATIBLE_PACKAGE_ZIP"
              --compatible-release-tag "${{ steps.target.outputs.compatible_tag }}"
            )
          elif [[ -n "$BASE_MANIFEST" ]]; then
            PACKAGE_ARGS+=(
              --target-source-commit "$TARGET_COMMIT"
              --base-manifest "$BASE_MANIFEST"
              --base-package-zip "$BASE_PACKAGE_ZIP"
              --base-release-tag "$BASE_TAG"
              --base-source-commit "$BASE_SOURCE_COMMIT"
              --selective-overlays "$SELECTIVE_OVERLAYS"
            )
          fi
          python3 tools/tumoflip/package_release.py "${PACKAGE_ARGS[@]}"
          VERSION="$(python3 - "$TARGET_MANIFEST" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text())["firmware"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "update_dir=dist/f7-C/f7-update-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare mixed firmware/package SHA-256 sums
        id: checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.packages.outputs.version }}
          UPDATE_DIR: ${{ steps.packages.outputs.update_dir }}
          CATALOG_TAG: ${{ steps.target.outputs.catalog_tag }}
        run: |
          set -euo pipefail
          WORK="dist/f7-C/package-release-existing-assets"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$WORK" \
            --pattern "flipper-z-f7-full-${VERSION}.dfu" \
            --pattern "flipper-z-f7-sdk-${VERSION}.zip" \
            --pattern "flipper-z-f7-update-${VERSION}.tgz" \
            --pattern "${VERSION}-SHA256SUMS"
          python3 tools/tumoflip/verify_release_assets.py \
            "${WORK}/${VERSION}-SHA256SUMS" \
            "${WORK}/flipper-z-f7-full-${VERSION}.dfu" \
            "${WORK}/flipper-z-f7-sdk-${VERSION}.zip" \
            "${WORK}/flipper-z-f7-update-${VERSION}.tgz" \
            "${{ steps.target.outputs.manifest }}" \
            "${{ steps.target.outputs.package_zip }}"
          if [[ -n "$CATALOG_TAG" ]]; then
            SHA_FILE="dist/f7-C/${CATALOG_TAG}-SHA256SUMS"
            (
              cd "dist/f7-C/f7-update-${VERSION}"
              sha256sum tumoflip-packages.json tumoflip-packages.zip
            ) > "$GITHUB_WORKSPACE/$SHA_FILE"
          else
            SHA_FILE="dist/f7-C/${VERSION}-SHA256SUMS"
            (
              cd dist/f7-C
              sha256sum \
                "package-release-existing-assets/flipper-z-f7-full-${VERSION}.dfu" \
                "package-release-existing-assets/flipper-z-f7-sdk-${VERSION}.zip" \
                "package-release-existing-assets/flipper-z-f7-update-${VERSION}.tgz" \
                "f7-update-${VERSION}/tumoflip-packages.json" \
                "f7-update-${VERSION}/tumoflip-packages.zip" \
                | sed "s#package-release-existing-assets/##; s#f7-update-${VERSION}/##"
            ) > "$SHA_FILE"
          fi
          echo "sha_file=${SHA_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish package-only assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          UPDATE_DIR: ${{ steps.packages.outputs.update_dir }}
          SHA_FILE: ${{ steps.checksums.outputs.sha_file }}
          CATALOG_TAG: ${{ steps.target.outputs.catalog_tag }}
          CHANNEL: ${{ steps.target.outputs.channel }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          COMPATIBLE_TAG: ${{ steps.target.outputs.compatible_tag }}
          BASE_TAG: ${{ steps.target.outputs.base_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$CATALOG_TAG" ]]; then
            SOURCE_COMMIT="$(git rev-parse HEAD)"
            CREATE_ARGS=(
              "$CATALOG_TAG"
              "${UPDATE_DIR}/tumoflip-packages.json"
              "${UPDATE_DIR}/tumoflip-packages.zip"
              "${SHA_FILE}"
              --repo "$GITHUB_REPOSITORY"
              --target "$SOURCE_COMMIT"
              --title "FW Packages ${CHANNEL^} ${CATALOG_TAG##*-}"
              --notes "Independent ${CHANNEL} FW Packages revision. Compatible firmware is validated by Tumoflip lineage, hardware target, API and package channel. Baseline: ${TARGET_TAG}. Selective base: ${BASE_TAG:-none}. Previous exact overlays: ${COMPATIBLE_TAG:-none}. Source: ${SOURCE_COMMIT}. This release contains no firmware image."
            )
            if [[ "$CHANNEL" == "dev" ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "${CREATE_ARGS[@]}"
          else
            gh release upload "$TAG" \
              "${UPDATE_DIR}/tumoflip-packages.json" \
              "${UPDATE_DIR}/tumoflip-packages.zip" \
              "${SHA_FILE}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          fi

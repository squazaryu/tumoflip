# Post the Build & analyze report from the trusted default-branch context.
#
# Security contract:
# - pr-build.yml executes untrusted PR code with a read-only token;
# - this workflow never checks out or executes PR code;
# - the report artifact is treated only as text;
# - the artifact-provided PR number is verified against workflow_run.head_sha.

name: PR report comment

on:
  workflow_run:
    workflows: ["Build & analyze"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: pr-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post report comment
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    steps:
      - name: Download report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Warn if report unavailable
        if: steps.download.outcome != 'success'
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: echo "::warning::pr-report artifact unavailable ($DOWNLOAD_OUTCOME); no comment posted."

      - name: Post or update comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_report.md') || !fs.existsSync('pr_number.txt')) {
              core.warning('Report artifact is incomplete; no comment posted.');
              return;
            }

            const marker = '<!-- tumoflip-pr-report -->';
            const body = fs.readFileSync('pr_report.md', 'utf8');
            const issueNumber = Number.parseInt(
              fs.readFileSync('pr_number.txt', 'utf8').trim(),
              10);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('Invalid PR number in report artifact.');
              return;
            }

            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            let pullRequest;
            try {
              ({ data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issueNumber,
              }));
            } catch (error) {
              core.setFailed(`Could not load PR #${issueNumber}: ${error.message}`);
              return;
            }

            if (pullRequest.head.sha !== headSha) {
              core.setFailed(
                `PR #${issueNumber} is at ${pullRequest.head.sha}, but the ` +
                `triggering build ran ${headSha}; refusing to comment.`);
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 });
            const existing = comments.find(
              comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

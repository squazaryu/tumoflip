name: Protected App Audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Exact xMasterX/all-the-plugins release tag"
        required: true
        type: string
      previous_source_tag:
        description: "Previous reviewed all-the-plugins release tag"
        required: true
        type: string
      issue_number:
        description: "Optional canonical issue number; empty creates/reuses one"
        required: false
        type: string
      sequence:
        description: "Monotonic ledger sequence, for example 2026080901"
        required: true
        type: number
      target_manifests:
        description: "Optional exact FW Packages tags; empty discovers latest stable/dev"
        required: false
        type: string
      decisions_json:
        description: "Optional repository-relative reviewed decisions JSON"
        required: false
        type: string

# Every run updates one cumulative branch. Tags must not publish concurrently.
concurrency:
  group: protected-app-audit-ledger
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate dispatch inputs
        id: selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_source_tag }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SEQUENCE: ${{ inputs.sequence }}
          TARGET_MANIFESTS: ${{ inputs.target_manifests }}
          DECISIONS_JSON: ${{ inputs.decisions_json }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_TAG" ]]; then
            gh api 'repos/xMasterX/all-the-plugins/releases?per_page=100' \
              > "$RUNNER_TEMP/community-releases.json"
            jq -r '
              map(select(
                (.draft == false) and (.prerelease == false)
                and (.tag_name | test("^[0-9]{1,2}[a-z]{3}[0-9]{4}(p[0-9]+)?$"))
                and any(.assets[]; .name == "all-the-apps-base.zip")
                and any(.assets[]; .name == "all-the-apps-extra.zip")
              )) | sort_by(.published_at) | reverse | .[0:2] | .[].tag_name
            ' "$RUNNER_TEMP/community-releases.json" > "$RUNNER_TEMP/community-tags.txt"
            SOURCE_TAG="$(sed -n '1p' "$RUNNER_TEMP/community-tags.txt")"
            PREVIOUS_TAG="$(sed -n '2p' "$RUNNER_TEMP/community-tags.txt")"
          fi
          if [[ -z "$TARGET_MANIFESTS" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > "$RUNNER_TEMP/tumoflip-releases.json"
            STABLE_TARGET="$(jq -r '
              map(select((.draft == false) and (.prerelease == false)
                and (.tag_name | test("^fw-packages-stable-[0-9]{3}$"))))
              | sort_by(.tag_name | capture("-(?<revision>[0-9]{3})$").revision | tonumber)
              | reverse | .[0].tag_name
            ' "$RUNNER_TEMP/tumoflip-releases.json")"
            DEV_TARGET="$(jq -r '
              map(select((.draft == false) and (.prerelease == true)
                and (.tag_name | test("^fw-packages-dev-[0-9]{3}$"))))
              | sort_by(.tag_name | capture("-(?<revision>[0-9]{3})$").revision | tonumber)
              | reverse | .[0].tag_name
            ' "$RUNNER_TEMP/tumoflip-releases.json")"
            [[ "$STABLE_TARGET" != null && "$DEV_TARGET" != null ]]
            TARGET_MANIFESTS="$STABLE_TARGET,$DEV_TARGET"
          fi
          [[ "$SOURCE_TAG" =~ ^[0-9]{1,2}[a-z]{3}[0-9]{4}(p[0-9]+)?$ ]]
          [[ "$PREVIOUS_TAG" =~ ^[0-9]{1,2}[a-z]{3}[0-9]{4}(p[0-9]+)?$ ]]
          [[ -z "$ISSUE_NUMBER" || "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ -z "$SEQUENCE" || "$SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$TARGET_MANIFESTS" =~ ^fw-packages-(stable|dev)-[0-9]{3}(,fw-packages-(stable|dev)-[0-9]{3})+$ ]]
          if [[ -n "$DECISIONS_JSON" ]]; then
            [[ "$DECISIONS_JSON" =~ ^tools/tumoflip/protected_audit_decisions/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*\.json$ ]]
          fi
          {
            echo "source_tag=$SOURCE_TAG"
            echo "previous_tag=$PREVIOUS_TAG"
            echo "target_manifests=$TARGET_MANIFESTS"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact Tumoflip source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: "true"

      - name: Resolve immutable Community Pack release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
          PREVIOUS_TAG: ${{ steps.selection.outputs.previous_tag }}
          REQUESTED_SEQUENCE: ${{ inputs.sequence }}
        run: |
          set -euo pipefail
          SOURCE_JSON="$RUNNER_TEMP/source-release.json"
          gh api "repos/xMasterX/all-the-plugins/releases/tags/$SOURCE_TAG" > "$SOURCE_JSON"
          WORK="$RUNNER_TEMP/all-the-plugins"
          git init -q "$WORK"
          git -C "$WORK" remote add origin https://github.com/xMasterX/all-the-plugins.git
          git -C "$WORK" fetch --no-tags --depth=1 origin \
            "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG" \
            "refs/tags/$PREVIOUS_TAG:refs/tags/$PREVIOUS_TAG"
          SOURCE_COMMIT="$(git -C "$WORK" rev-parse "refs/tags/$SOURCE_TAG^{commit}")"
          PREVIOUS_COMMIT="$(git -C "$WORK" rev-parse "refs/tags/$PREVIOUS_TAG^{commit}")"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          SOURCE_TAG_TARGET="$(git -C "$WORK" rev-parse "refs/tags/$SOURCE_TAG^{}")"
          PREVIOUS_TAG_TARGET="$(git -C "$WORK" rev-parse "refs/tags/$PREVIOUS_TAG^{}")"
          [[ "$SOURCE_TAG_TARGET" == "$SOURCE_COMMIT" ]]
          [[ "$PREVIOUS_TAG_TARGET" == "$PREVIOUS_COMMIT" ]]

          mkdir -p "$RUNNER_TEMP/community-pack"
          gh release download "$SOURCE_TAG" --repo xMasterX/all-the-plugins \
            --dir "$RUNNER_TEMP/community-pack" \
            --pattern all-the-apps-base.zip --pattern all-the-apps-extra.zip
          BASE_SHA="$(jq -r '.assets[] | select(.name == "all-the-apps-base.zip") | .digest' "$SOURCE_JSON" | sed 's/^sha256://')"
          EXTRA_SHA="$(jq -r '.assets[] | select(.name == "all-the-apps-extra.zip") | .digest' "$SOURCE_JSON" | sed 's/^sha256://')"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXTRA_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$BASE_SHA" "$RUNNER_TEMP/community-pack/all-the-apps-base.zip" | sha256sum -c -
          printf '%s  %s\n' "$EXTRA_SHA" "$RUNNER_TEMP/community-pack/all-the-apps-extra.zip" | sha256sum -c -
          API="$(jq -r '.body | capture("API version: (?<api>[0-9]+\\.[0-9]+)").api' "$SOURCE_JSON")"
          [[ "$API" =~ ^[0-9]+\.[0-9]+$ ]]
          SEQUENCE="$REQUESTED_SEQUENCE"
          if [[ -z "$SEQUENCE" ]]; then
            SEQUENCE="$(date -u -d "$(jq -r .published_at "$SOURCE_JSON")" +%Y%m%d%H%M%S)"
          fi
          [[ "$SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "previous_commit=$PREVIOUS_COMMIT"
            echo "base_sha=$BASE_SHA"
            echo "extra_sha=$EXTRA_SHA"
            echo "published_at=$(jq -r .published_at "$SOURCE_JSON")"
            echo "api=$API"
            echo "sequence=$SEQUENCE"
            echo "repo=$WORK"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exactly one canonical issue
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_NUMBER: ${{ inputs.issue_number }}
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          EXTRA_SHA: ${{ steps.source.outputs.extra_sha }}
        run: |
          set -euo pipefail
          MARKER="<!-- protected-app-audit:$SOURCE_TAG:$BASE_SHA:$EXTRA_SHA -->"
          TITLE="Audit protected apps for Community Pack $SOURCE_TAG"
          if [[ -n "$REQUESTED_NUMBER" ]]; then
            ISSUE_NUMBER="$REQUESTED_NUMBER"
          else
            ISSUE_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
              --limit 100 --json number,title,body > "$RUNNER_TEMP/issues.json"; \
              jq -r --arg title "$TITLE" --arg marker "$MARKER" \
                --arg source "$SOURCE_COMMIT" --arg base "$BASE_SHA" --arg extra "$EXTRA_SHA" \
                '.[] | select(.title == $title and ((.body | contains($marker)) or \
                  ((.body | contains($source)) and (.body | contains($base)) and (.body | contains($extra))))) | .number' \
                "$RUNNER_TEMP/issues.json" | head -n1)"
          fi
          if [[ -z "$ISSUE_NUMBER" ]]; then
            {
              echo "$MARKER"
              echo '## Pack identity'
              echo
              printf -- '- source commit: `%s`\n' "$SOURCE_COMMIT"
              printf -- '- base archive SHA-256: `%s`\n' "$BASE_SHA"
              printf -- '- extra archive SHA-256: `%s`\n' "$EXTRA_SHA"
              echo
              echo 'The audit ledger is fail-closed until exact artifact decisions are recorded below.'
            } > "$RUNNER_TEMP/new-issue.md"
            ISSUE_URL="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file "$RUNNER_TEMP/new-issue.md")"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          ISSUE_JSON="$RUNNER_TEMP/issue.json"
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,state,url > "$ISSUE_JSON"
          EXISTING_TITLE="$(jq -r .title "$ISSUE_JSON")"
          [[ "$EXISTING_TITLE" == "$TITLE" || "$EXISTING_TITLE" == "Audit protected apps for Community Pack $SOURCE_TAG" ]]
          jq -e --arg marker "$MARKER" --arg source "$SOURCE_COMMIT" \
            --arg base "$BASE_SHA" --arg extra "$EXTRA_SHA" \
            '.body | (contains($marker) or (contains($source) and contains($base) and contains($extra)))' \
            "$ISSUE_JSON" >/dev/null
          BODY="$(jq -r .body "$ISSUE_JSON")"
          if [[ "$BODY" != *"$MARKER"* ]]; then
            jq -r .body "$ISSUE_JSON" > "$RUNNER_TEMP/reconciled-issue.md"
            printf '\n%s\n' "$MARKER" >> "$RUNNER_TEMP/reconciled-issue.md"
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/reconciled-issue.md" >/dev/null
          fi
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url "$ISSUE_JSON")" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r .state "$ISSUE_JSON")" >> "$GITHUB_OUTPUT"

      - name: Download and verify exact accepted Tumoflip targets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MANIFESTS: ${{ steps.selection.outputs.target_manifests }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/targets"
          IFS=',' read -ra TAGS <<< "$TARGET_MANIFESTS"
          for TAG in "${TAGS[@]}"; do
            case "$TAG" in
              fw-packages-stable-*) CHANNEL=stable ;;
              fw-packages-dev-*) CHANNEL=dev ;;
              *) echo "Unexpected package tag: $TAG" >&2; exit 1 ;;
            esac
            DEST="$RUNNER_TEMP/targets/$TAG"
            mkdir -p "$DEST"
            RELEASE_JSON="$DEST/release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON"
            TAG_OBJECT="$DEST/tag-object.json"
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$TAG_OBJECT"
            RELEASE_TAG_COMMIT="$(jq -r .object.sha "$TAG_OBJECT")"
            if [[ "$(jq -r .object.type "$TAG_OBJECT")" == tag ]]; then
              RELEASE_TAG_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$RELEASE_TAG_COMMIT" --jq .object.sha)"
            fi
            [[ "$RELEASE_TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            MANIFEST_SHA="$(jq -r '.assets[] | select(.name == "tumoflip-packages.json") | .digest' "$RELEASE_JSON" | sed 's/^sha256://')"
            ZIP_SHA="$(jq -r '.assets[] | select(.name == "tumoflip-packages.zip") | .digest' "$RELEASE_JSON" | sed 's/^sha256://')"
            [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ZIP_SHA" =~ ^[0-9a-f]{64}$ ]]
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$DEST" \
              --pattern tumoflip-packages.json --pattern tumoflip-packages.zip
            printf '%s  %s\n' "$MANIFEST_SHA" "$DEST/tumoflip-packages.json" | sha256sum -c -
            printf '%s  %s\n' "$ZIP_SHA" "$DEST/tumoflip-packages.zip" | sha256sum -c -
            MANIFEST_SOURCE="$(jq -r .package_release.source_commit "$DEST/tumoflip-packages.json")"
            [[ "$RELEASE_TAG_COMMIT" == "$MANIFEST_SOURCE" ]]
            cp "$DEST/tumoflip-packages.json" "$RUNNER_TEMP/targets/$CHANNEL:$TAG=manifest.json"
            cp "$DEST/tumoflip-packages.zip" "$RUNNER_TEMP/targets/$CHANNEL:$TAG=targets.zip"
          done

      - name: Scan protected intersections
        id: scan
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          SEQUENCE: ${{ steps.source.outputs.sequence }}
          DECISIONS_JSON: ${{ inputs.decisions_json }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          PREVIOUS_COMMIT: ${{ steps.source.outputs.previous_commit }}
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          EXTRA_SHA: ${{ steps.source.outputs.extra_sha }}
          PUBLISHED_AT: ${{ steps.source.outputs.published_at }}
          API: ${{ steps.source.outputs.api }}
          SOURCE_REPO: ${{ steps.source.outputs.repo }}
        run: |
          set -euo pipefail
          ARGS=(scan --repo "$SOURCE_REPO" --implementation-repo "$GITHUB_WORKSPACE"
            --registry tools/tumoflip/protected_apps_registry.json
            --base-archive "$RUNNER_TEMP/community-pack/all-the-apps-base.zip"
            --extra-archive "$RUNNER_TEMP/community-pack/all-the-apps-extra.zip"
            --base-sha256 "$BASE_SHA" --extra-sha256 "$EXTRA_SHA"
            --source-tag "$SOURCE_TAG" --source-commit "$SOURCE_COMMIT"
            --previous-source-commit "$PREVIOUS_COMMIT"
            --release-url "https://github.com/xMasterX/all-the-plugins/releases/tag/$SOURCE_TAG"
            --published-at "$PUBLISHED_AT" --api "$API" --sequence "$SEQUENCE"
            --issue-number "$ISSUE_NUMBER" --issue-url "$ISSUE_URL"
            --output-audit "$RUNNER_TEMP/audit.json"
            --output-summary "$RUNNER_TEMP/summary.md")
          while IFS= read -r MANIFEST; do ARGS+=(--target-manifest "$MANIFEST"); done < <(find "$RUNNER_TEMP/targets" -name '*=manifest.json' -type f | sort)
          while IFS= read -r ARCHIVE; do ARGS+=(--target-archive "$ARCHIVE"); done < <(find "$RUNNER_TEMP/targets" -name '*=targets.zip' -type f | sort)
          if [[ -z "$DECISIONS_JSON" && -f "tools/tumoflip/protected_audit_decisions/$SOURCE_TAG.json" ]]; then
            DECISIONS_JSON="tools/tumoflip/protected_audit_decisions/$SOURCE_TAG.json"
          fi
          if [[ -n "$DECISIONS_JSON" ]]; then ARGS+=(--decisions "$DECISIONS_JSON"); fi
          python3 tools/tumoflip/protected_app_audit.py "${ARGS[@]}" | tee "$RUNNER_TEMP/result.json"
          echo "status=$(jq -r .overallStatus "$RUNNER_TEMP/result.json")" >> "$GITHUB_OUTPUT"

      - name: Run fail-closed schema tests
        shell: bash
        run: python3 -m unittest tools/tumoflip/test_protected_app_audit.py tools/tumoflip/test_ci_workflows.py

      - name: Reopen canonical issue for unresolved artifacts
        if: steps.scan.outputs.status != 'verified' && steps.issue.outputs.state != 'OPEN'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: gh issue reopen "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Reconcile canonical issue comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          COMMENT_ID="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --paginate --jq '.[] | select(.body | contains("<!-- tumoflip-protected-app-audit -->")) | .id' | head -n1)"
          jq -n --rawfile body "$RUNNER_TEMP/summary.md" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              --input "$RUNNER_TEMP/comment.json" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              --input "$RUNNER_TEMP/comment.json" >/dev/null
          fi

      - name: Publish cumulative partial ledger atomically
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
          SEQUENCE: ${{ steps.source.outputs.sequence }}
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          EXTRA_SHA: ${{ steps.source.outputs.extra_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin protected-app-audit-ledger || true
          PUBLISH="$RUNNER_TEMP/publish"
          git worktree add --detach "$PUBLISH" HEAD
          if git show-ref --verify --quiet refs/remotes/origin/protected-app-audit-ledger; then
            git -C "$PUBLISH" switch -c protected-app-audit-ledger --track origin/protected-app-audit-ledger
          else
            git -C "$PUBLISH" switch --orphan protected-app-audit-ledger
            git -C "$PUBLISH" rm -rf --ignore-unmatch .
          fi
          mkdir -p "$PUBLISH/history"
          HISTORY="$SEQUENCE-$SOURCE_TAG-${BASE_SHA:0:12}-${EXTRA_SHA:0:12}.json"
          cp "$RUNNER_TEMP/audit.json" "$PUBLISH/history/$HISTORY"
          python3 "$GITHUB_WORKSPACE/tools/tumoflip/protected_app_audit.py" merge \
            --existing "$PUBLISH/latest.json" --audit "$RUNNER_TEMP/audit.json" \
            --output "$PUBLISH/latest.json"
          python3 "$GITHUB_WORKSPACE/tools/tumoflip/protected_app_audit.py" validate "$PUBLISH/latest.json"
          git -C "$PUBLISH" add latest.json "history/$HISTORY"
          git -C "$PUBLISH" diff --cached --check
          if ! git -C "$PUBLISH" diff --cached --quiet; then
            git -C "$PUBLISH" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(audit): publish protected app ledger for $SOURCE_TAG"
            git -C "$PUBLISH" push origin HEAD:protected-app-audit-ledger
          fi

      - name: Close only a fully verified canonical issue
        if: steps.scan.outputs.status == 'verified'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          set -euo pipefail
          CURRENT="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,url --jq '.state + " " + .url')"
          [[ "$CURRENT" == "OPEN $ISSUE_URL" || "$CURRENT" == "CLOSED $ISSUE_URL" ]]
          if [[ "$CURRENT" == "OPEN $ISSUE_URL" ]]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Preserve exact audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: protected-app-audit-${{ steps.selection.outputs.source_tag }}
          path: |
            ${{ runner.temp }}/audit.json
            ${{ runner.temp }}/summary.md
          if-no-files-found: error
          retention-days: 30
